[project]
name = "brain-agent"
version = "0.1.0"
description = "Our own Pydantic AI agent for the BitGN Brain shared ECOM1 workspace."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic-ai-slim[anthropic,openai,mcp,ag-ui]>=2.59,<2.60",
    "pydantic-ai-harness>=0.59,<0.60",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
    "logfire[starlette]>=4.0",
    "pydantic-evals>=2.59,<2.60",
]

[project.scripts]
brain-agent = "brain_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
